services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: verka-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: verka
      POSTGRES_PASSWORD: verka
      POSTGRES_DB: verka
    volumes:
      - postgres-data:/var/lib/posgresql

volumes:
  postgres-data:
